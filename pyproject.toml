[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "just_fiberassign"
version = "0.2.0"
description = "JUST fiber assignment utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy", "numba", "requests", "scipy>=1.9", "tqdm",
    "ortools<9.15; python_version<'3.10'", "ortools; python_version>='3.10'"
]

[project.optional-dependencies]
plot = [
    "basemap", "healpy", "matplotlib",
    "numpy<2; python_version<'3.10'"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
just_fiberassign = ["data/*.csv", "data/*.png", "data/*.txt"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "just_fiberassign"
version = "0.1.0"
description = "JUST fiber assignment utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "ortools", "requests", "scipy>=1.9", "tqdm"]

[project.optional-dependencies]
demo = ["astropy<6.1; python_version<'3.10'", "astropy>=6.1; python_version>='3.10'", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
just_fiberassign = ["data/*.csv", "data/*.txt"]
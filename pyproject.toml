[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "just_fiberassign"
version = "0.2.0"
description = "JUST fiber assignment utilities"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "numba",
    "ortools<9.15; python_version<'3.10'",
    "ortools; python_version>='3.10'",
    "requests",
    "scipy>=1.9",
    "tqdm"
]

[project.optional-dependencies]
plot = ["matplotlib", "healpy", "basemap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
just_fiberassign = ["data/*.csv", "data/*.png", "data/*.txt"]
